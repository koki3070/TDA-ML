# H1-only tune on NORMAL-direction outliers with the elongate_barrier guard.
# Identical to elongate_n100_no_cls_tune_local_pca_ellphi_power_h1_neartangent_barrier
# except data.tangent_direction: normal and a tighter offset range.
#
# Why normal: near-tangent outliers sit along the local-PCA major axis, so
# anisotropic (ellipse/Mahalanobis) methods absorb them as stroke continuation
# (proposed AND ADBSCAN both dropped to recall ~0.48 on near-tangent data).
# Displacing across the stroke (minor axis) is the setting the anisotropy
# hypothesis actually predicts an advantage for: the outlier stays Euclidean-
# close to the stroke (adversarial for isotropic DBSCAN) but crosses the thin
# ellipse (large Mahalanobis distance).
#
# Offsets 0.10-0.25 keep outliers inside the DBSCAN eps grid (0.15-0.825) so
# Euclidean clustering tends to connect them to the stroke.

meta:
  config_id: "elongate_n100_no_cls_tune_local_pca_ellphi_power_h1_normal_barrier"

model:
  point_dim: 2
  feature_dim: 128
  ellipse_param_dim: 5
  threshold: 0.5
  topology_loss:
    metric_type: "anisotropic"
    distance_backend: "mahalanobis"  # overridden to ellphi by tune script
    ellphi_differentiable: true
    prob_weighting: false
    homology_dimensions: [1]

loss:
  w_class: 0.0
  w_topo: 0.0883
  w_aniso: 0.0541
  w_size: 0.488
  pos_weight: 1.0
  aniso_mode: elongate_barrier
  aniso_barrier_threshold: 6.0
  size_mode: power
  size_ref: 1.34
  size_power: 1.5
  teacher_mode: local_pca
  teacher_local_pca_k: 10
  teacher_local_pca_normalize_axes: true

training:
  lr: 0.000158
  epochs: 20
  grad_clip_value: 1.0
  visualize_every: 10000
  warmup_epochs: 0
  selection:
    metric: val_topo
    eval_every: 1
    dbscan:
      eps_values: null
      min_samples_values: null

data:
  max_points: 100
  num_outliers: 20
  # Off-manifold anisotropic outliers: displace inliers within a ±30° cone
  # around the local-PCA MINOR axis (across the stroke), rejected until
  # >=0.08 from every clean inlier. noise_std matches the uniform baseline.
  outlier_mode: local_pca_tangent
  noise_std: 0.01
  tangent_pca_k: 10
  tangent_offset_min: 0.10
  tangent_offset_max: 0.25
  tangent_angle_jitter_deg: 30.0
  tangent_stroke_clearance: 0.08
  tangent_direction: normal
  seed: 42
  train_size: 4500
  val_size: 500
  test_size: 1000
  num_workers: 2
  batch_size: 64
  pin_memory: true

performance:
  cudnn_benchmark: true
  enable_tf32: true
  matmul_precision: high

outputs:
  base_dir: "outputs"
  save_every: 1
