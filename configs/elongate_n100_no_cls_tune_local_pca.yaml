# Optuna tune base: no_cls + full-cloud topo + local_pca ellphi teacher + val_topo ckpt.
# 20-epoch proxy; hyperparams (w_*, lr) are searched by tune_elongate_wdist.py.

meta:
  config_id: "elongate_n100_no_cls_tune_local_pca"

model:
  point_dim: 2
  feature_dim: 128
  ellipse_param_dim: 5
  threshold: 0.5
  topology_loss:
    metric_type: "anisotropic"
    distance_backend: "mahalanobis"  # overridden per trial (--backend ellphi)
    ellphi_differentiable: true
    prob_weighting: false

loss:
  w_class: 0.0
  w_topo: 0.0883   # placeholder; Optuna search replaces
  w_aniso: 0.0541
  w_size: 0.488
  pos_weight: 1.0
  aniso_mode: "elongate"
  teacher_mode: local_pca
  teacher_local_pca_k: 10

training:
  lr: 0.000158
  epochs: 20
  grad_clip_value: 1.0
  visualize_every: 10000
  warmup_epochs: 0
  selection:
    metric: val_topo
    eval_every: 1

data:
  max_points: 100
  num_outliers: 20
  noise_std: 0.01
  seed: 42
  train_size: 4500
  val_size: 500
  test_size: 1000
  num_workers: 2
  batch_size: 64
  pin_memory: true

performance:
  cudnn_benchmark: true
  enable_tf32: true
  matmul_precision: high

outputs:
  base_dir: "outputs"
  save_every: 1
