# Elongate main run (1 seed, 30ep) for n100 (100 inliers + 20 outliers, 16.7% contamination).
# Hyperparams from Optuna 4D W-Dist tuning (outputs/tune_elongate/best_elongate_wdist.json,
# 56 trials, mahalanobis backend, 20ep proxy). See docs/anisotropy_investigation.md.

meta:
  config_id: "elongate_n100"

model:
  point_dim: 2
  feature_dim: 128
  ellipse_param_dim: 5
  threshold: 0.5
  topology_loss:
    metric_type: "anisotropic"
    distance_backend: "mahalanobis"  # overridden per run by run_backend_multiseed
    ellphi_differentiable: true

loss:
  w_class: 1.0
  w_topo: 0.0883   # tuned (W-Dist objective, val best=0.0390)
  w_aniso: 0.0541
  w_size: 0.488
  pos_weight: 1.0
  aniso_mode: "elongate"

training:
  lr: 0.000158   # tuned
  epochs: 30
  grad_clip_value: 1.0
  visualize_every: 10
  warmup_epochs: 0
  # Checkpoint selection = paper protocol: DBSCAN on predicted ellipse params,
  # pick the epoch with the lowest mean val W-Dist (same grid as final eval).
  # The chosen (eps, min_samples) is saved to logs/dbscan_hparams_train.json.
  selection:
    metric: wdist        # wdist | dbscan_mcc | threshold_mcc | val_loss
    eval_every: 1        # grid-search every epoch (mahalanobis: ~+tens of min)
    dbscan:
      eps_values: null         # null -> linspace(0.15, 1.5, 15)
      min_samples_values: null # null -> [3, 5, 7, 10, 15]

data:
  max_points: 100      # inlier (digit stroke) points
  num_outliers: 20     # uniform outliers -> 20/120 = 16.7% contamination
  noise_std: 0.01
  seed: 42
  train_size: 4500
  val_size: 500
  test_size: 1000
  num_workers: 2   # conservative for shared 192-core host
  batch_size: 64
  pin_memory: true

performance:
  cudnn_benchmark: true
  enable_tf32: true
  matmul_precision: high

outputs:
  base_dir: "outputs"
  save_every: 1
