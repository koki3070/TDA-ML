# EXPERIMENTAL (uncommitted) config: mahalanobis backend convergence check, N=100.
# Probability-based distance weighting DISABLED (prob_weighting: false) so the
# comparison against ellphi is a fair backend ablation (ellphi never uses probs).
# Mirrors _conv_n100.yaml hyperparameters. distance_backend is also set by the
# multiseed driver via --backends mahalanobis.
meta:
  config_id: "mahal_n100_noprob"

model:
  point_dim: 2
  feature_dim: 128
  ellipse_param_dim: 5
  threshold: 0.5
  topology_loss:
    metric_type: "anisotropic"
    distance_backend: "mahalanobis"
    ellphi_differentiable: true
    prob_weighting: false

loss:
  w_class: 1.0
  w_topo: 0.1
  w_aniso: 0.01099204345474479
  w_size: 0.0055785823086202556
  pos_weight: 1.0
  aniso_mode: "linear"

training:
  lr: 0.0004897466143769238
  epochs: 30
  grad_clip_value: 1.0
  visualize_every: 10
  warmup_epochs: 0

data:
  max_points: 100
  num_outliers: 20
  seed: 42
  test_size: 1000
  num_workers: 4
  batch_size: 64

outputs:
  base_dir: "outputs"
