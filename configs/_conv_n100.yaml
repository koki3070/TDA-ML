# EXPERIMENTAL (uncommitted) config for the N=100 convergence check (seed42, 30ep).
# Mirrors reproduce.yaml hyperparameters but max_points=100 (matches base.yaml /
# paper eval protocol). num_outliers kept at 20 (=> 20% ratio, same as eval run_meta).
# Pending spec decision: see proposed issue "max_points 200->100".
meta:
  config_id: "conv_n100"

model:
  point_dim: 2
  feature_dim: 128
  ellipse_param_dim: 5
  threshold: 0.5
  topology_loss:
    metric_type: "anisotropic"
    distance_backend: "mahalanobis"
    ellphi_differentiable: true

loss:
  w_class: 1.0
  w_topo: 0.1
  w_aniso: 0.01099204345474479
  w_size: 0.0055785823086202556
  pos_weight: 1.0
  aniso_mode: "linear"

training:
  lr: 0.0004897466143769238
  epochs: 30
  grad_clip_value: 1.0
  visualize_every: 10
  warmup_epochs: 0

data:
  max_points: 100
  num_outliers: 20
  seed: 42
  test_size: 1000
  num_workers: 4
  batch_size: 64

outputs:
  base_dir: "outputs"
