# Ablation: paper §3.3.2 teacher (local PCA ideal ellipses + same backend as prediction).
# Loss weights: baseline (maha-tune v1 anchors). v3 topo-only tune (w_size≈0) hurt DBSCAN MCC — reverted 2026-07-06.
# Switch teacher: loss.teacher_mode = euclidean | local_pca

meta:
  config_id: "elongate_n100_no_cls_full120_teacher_local_pca"

model:
  point_dim: 2
  feature_dim: 128
  ellipse_param_dim: 5
  threshold: 0.5
  topology_loss:
    metric_type: "anisotropic"
    distance_backend: "mahalanobis"  # overridden per run by run_backend_multiseed
    ellphi_differentiable: true
    prob_weighting: false

loss:
  w_class: 0.0
  w_topo: 0.0883
  w_aniso: 0.0541
  w_size: 0.488
  pos_weight: 1.0
  aniso_mode: "elongate"
  size_mode: power
  size_ref: 1.34
  size_power: 1.5
  teacher_mode: local_pca
  teacher_local_pca_k: 10
  # Must match the tune base (elongate_n100_no_cls_tune_local_pca_ellphi_power_mcc);
  # tuned weights assume this teacher geometry.
  teacher_local_pca_normalize_axes: true

training:
  lr: 0.000158
  epochs: 30
  grad_clip_value: 1.0
  visualize_every: 10
  warmup_epochs: 0
  # Train ckpt: val_topo (same TopologicalLoss as training; no per-epoch DBSCAN grid).
  # DBSCAN grid + MCC: once after training via evaluate_paper_protocol.py (val → test).
  selection:
    metric: val_topo
    eval_every: 1
    dbscan:
      eps_values: null
      min_samples_values: null

data:
  max_points: 100
  num_outliers: 20
  noise_std: 0.01
  seed: 42
  train_size: 4500
  val_size: 500
  test_size: 1000
  num_workers: 2
  batch_size: 64
  pin_memory: true

performance:
  cudnn_benchmark: true
  enable_tf32: true
  matmul_precision: high

outputs:
  base_dir: "outputs"
  save_every: 1
