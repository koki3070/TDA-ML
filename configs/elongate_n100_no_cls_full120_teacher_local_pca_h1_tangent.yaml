# Paper no_cls production on tangent-direction outliers.
# Same stack as elongate_n100_no_cls_full120_teacher_local_pca (local-PCA teacher
# + ellphi topo + H1-only Wasserstein), but outliers are placed along local-PCA
# first principal axes (anisotropic noise) instead of uniform.
# Production 30ep weights MUST come from an H1-only tangent Optuna best JSON
# (--tune-json). The w_* / lr values below are Optuna prior centres only.

meta:
  config_id: "elongate_n100_no_cls_full120_teacher_local_pca_h1_tangent"

model:
  point_dim: 2
  feature_dim: 128
  ellipse_param_dim: 5
  threshold: 0.5
  topology_loss:
    metric_type: "anisotropic"
    distance_backend: "ellphi"
    ellphi_differentiable: true
    prob_weighting: false
    homology_dimensions: [1]

loss:
  w_class: 0.0
  # Prior centres for Optuna; paper production requires --tune-json overrides.
  w_topo: 0.0883
  w_aniso: 0.0541
  w_size: 0.488
  pos_weight: 1.0
  aniso_mode: elongate
  size_mode: power
  size_ref: 1.34
  size_power: 1.5
  teacher_mode: local_pca
  teacher_local_pca_k: 10
  teacher_local_pca_normalize_axes: true

training:
  lr: 0.000158
  epochs: 30
  grad_clip_value: 1.0
  visualize_every: 10
  warmup_epochs: 0
  selection:
    metric: val_topo
    eval_every: 1
    dbscan:
      eps_values: null
      min_samples_values: null

data:
  max_points: 100
  num_outliers: 20
  # Anisotropic outliers: displace inliers along local-PCA PC1 (tangent). noise_std
  # matches the uniform baseline so only the OUTLIER distribution differs, and the
  # jitter breaks exact MNIST-quantized coincidences that make the ellphi tangency
  # derivative w.r.t. mu undefined.
  outlier_mode: local_pca_tangent
  noise_std: 0.01
  tangent_pca_k: 10
  tangent_offset_min: 0.15
  tangent_offset_max: 0.40
  # Pure tangent (no direction jitter, no semantic stroke clearance).
  tangent_angle_jitter_deg: 0.0
  tangent_stroke_clearance: 0.0
  tangent_direction: tangent
  seed: 42
  train_size: 4500
  val_size: 500
  test_size: 1000
  num_workers: 2
  batch_size: 64
  pin_memory: true

performance:
  cudnn_benchmark: true
  enable_tf32: true
  matmul_precision: high

outputs:
  base_dir: "outputs"
  save_every: 1
