# Pure baseline: no fix1 (median), no fix2 (min_b), no fix3 (topo12).
# Full 120-point cloud for topo loss (default max_points unset).

meta:
  config_id: "elongate_n100_no_cls_full120_baseline"

model:
  point_dim: 2
  feature_dim: 128
  ellipse_param_dim: 5
  threshold: 0.5
  topology_loss:
    metric_type: "anisotropic"
    distance_backend: "mahalanobis"
    ellphi_differentiable: true
    prob_weighting: false

loss:
  w_class: 0.0
  w_topo: 0.0883
  w_aniso: 0.0541
  w_size: 0.488
  pos_weight: 1.0
  aniso_mode: "elongate"

training:
  lr: 0.000158
  epochs: 30
  grad_clip_value: 1.0
  visualize_every: 10
  warmup_epochs: 0
  selection:
    metric: wdist
    eval_every: 1
    dbscan:
      eps_values: null
      min_samples_values: null

data:
  max_points: 100
  num_outliers: 20
  noise_std: 0.01
  seed: 42
  train_size: 4500
  val_size: 500
  test_size: 1000
  num_workers: 2
  batch_size: 64
  pin_memory: true

performance:
  cudnn_benchmark: true
  enable_tf32: true
  matmul_precision: high

outputs:
  base_dir: "outputs"
  save_every: 1
