# Methods opt-in (not paper main table): MNIST near-tangent + H1 + elongate_barrier.
# Passes PAPER_NO_CLS_CONTRACT. Does NOT pass RINGS_NO_CLS_CONTRACT.
# Opt-in via BASE_CONFIG=methods_mnist_neartangent ; never an implicit swap for
# rings paper 30ep. Copy this file to retune on another geometry.
#
# Why barrier: on near-tangent data, plain `elongate` can collapse minor axes
# until ellphi tangency hard-fails; barrier keeps aspect <= T=6.0.

meta:
  config_id: "methods_mnist_neartangent"

model:
  point_dim: 2
  feature_dim: 128
  ellipse_param_dim: 5
  threshold: 0.5
  topology_loss:
    metric_type: "anisotropic"
    distance_backend: "ellphi"
    ellphi_differentiable: true
    prob_weighting: false
    homology_dimensions: [1]

loss:
  w_class: 0.0
  w_topo: 0.0883
  w_aniso: 0.0541
  w_size: 0.488
  pos_weight: 1.0
  aniso_mode: elongate_barrier
  aniso_barrier_threshold: 6.0
  size_mode: power
  size_ref: 1.34
  size_power: 1.5
  teacher_mode: local_pca
  teacher_local_pca_k: 10
  teacher_local_pca_normalize_axes: true
  teacher_local_pca_major_scale: 0.4
  topo_eps_scale: 1.0
  topo_scale_mode: fixed

training:
  lr: 0.000158
  epochs: 20
  grad_clip_value: 1.0
  visualize_every: 10000
  warmup_epochs: 0
  selection:
    metric: val_topo
    eval_every: 1
    dbscan:
      eps_values: null
      min_samples_values: null

data:
  dataset_type: mnist
  max_points: 100
  num_outliers: 20
  # GT-proximal anisotropic outliers: displace inliers within a ±30° cone
  # around local-PCA PC1, rejected until >=0.08 from every clean inlier.
  # noise_std matches the uniform baseline: inliers get the same isotropic
  # jitter so only the OUTLIER distribution differs.
  outlier_mode: local_pca_tangent
  noise_std: 0.01
  tangent_pca_k: 10
  tangent_offset_min: 0.15
  tangent_offset_max: 0.40
  tangent_angle_jitter_deg: 30.0
  tangent_stroke_clearance: 0.08
  tangent_direction: tangent
  seed: 42
  train_size: 4500
  val_size: 500
  test_size: 1000
  num_workers: 2
  batch_size: 64
  pin_memory: true

performance:
  cudnn_benchmark: true
  enable_tf32: true
  matmul_precision: high

outputs:
  base_dir: "outputs"
  save_every: 1
